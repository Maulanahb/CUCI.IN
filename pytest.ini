[pytest]
testpaths = tests/e2e
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    smoke: Pengujian cepat alur kritikal utama CUCI.IN
    auth: Pengujian login, registrasi, logout, dan RBAC
    pos: Pengujian kasir POS, quick-add pelanggan, dan struk thermal
    payment: Pengujian pembayaran tunai/DP, upload bukti digital, dan verifikasi kasir
    lifecycle: Pengujian siklus status cucian, rollback beralasan, dan pembatalan
    complaint: Pengujian pengaduan pelanggan, penanganan staf, dan Anti-IDOR
    admin: Pengujian master pengguna, layanan, pelanggan, dan ekspor laporan
    mobile: Pengujian responsivitas viewport mobile 375px
    bug_open: Regresi xfail untuk bug M3 yang masih terbuka pada baseline develop
